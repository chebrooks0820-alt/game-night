<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E0C34">
<title>Wine &amp; Food Festival Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Yellowtail&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#4E0C34; --plum-deep:#38071F; --cream:#F4E6CC; --cream-d:#E6D1AB;
  --teal:#19B3A0; --teal-d:#0C7F71; --coral:#F26A55; --ink:#3A0A26; --ink-soft:#6E3A56; --white:#fff;
  --disp:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --script:"Yellowtail","Brush Script MT",cursive;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--plum);color:var(--white);font:400 18px/1.45 var(--sans)}
button,input{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
.demo{background:var(--plum-deep);color:var(--cream);font-size:14px;text-align:center;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px}

/* hero */
.hero{position:relative;text-align:center;padding:calc(26px + env(safe-area-inset-top,0px)) 0 10px;overflow:hidden}
.hero.has-demo{padding-top:26px}
.logo{display:block;width:176px;height:auto;margin:0 auto 6px}
.dice{position:absolute;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.dice svg{display:block;width:100%;height:auto}
.d1{left:8px;top:18px;width:62px;transform:rotate(-14deg)}
.d2{left:46px;top:70px;width:54px;transform:rotate(16deg)}
.spark{position:absolute;fill:#fff}
.s1{right:22px;top:30px;width:30px}
.s2{right:60px;top:72px;width:18px}
.s3{right:12px;top:96px;width:14px}
h1.title{font:900 clamp(64px,21vw,100px)/.88 var(--disp);margin:6px 0 0;letter-spacing:.005em}
.script{font:400 32px/1.1 var(--script);color:var(--coral);margin:6px 0 0}
.lede{max-width:31ch;margin:14px auto 0;font-size:18px}

/* player */
.pcard{background:var(--cream);color:var(--ink);border-radius:14px;padding:18px 18px 20px;margin:22px 0 0}
.pcard h2{font:800 30px/1 var(--disp);margin:0 0 6px}
.pcard p{margin:0 0 4px;color:var(--ink-soft);font-size:16px}
.pcard label{display:block;font-weight:600;margin:14px 0 6px;font-size:16px}
.pcard input{width:100%;min-height:54px;padding:10px 14px;border-radius:10px;border:2px solid rgba(78,12,52,.35);background:#FFF9EC;color:var(--ink);font:500 18px var(--sans)}
.pcard input[aria-invalid="true"]{border-color:#B3261E}
.err{color:#A3201A;font-size:15px;font-weight:600;margin-top:6px}
.err:empty{display:none}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--cream);color:var(--ink);border-radius:14px;padding:6px 8px 6px 18px;margin:22px 0 0;min-height:56px}
.linkbtn{min-height:48px;padding:0 12px;background:none;border:0;color:var(--teal-d);font:700 17px var(--sans);text-decoration:underline;text-underline-offset:3px}
.linkbtn.light{color:var(--cream)}
.pad{display:block;margin:14px auto 0}

/* buttons */
.primary{display:block;width:100%;min-height:58px;border:0;border-radius:12px;background:var(--coral);color:var(--plum-deep);font:800 22px var(--disp);letter-spacing:.02em;margin-top:18px}
.primary[disabled]{opacity:.45;cursor:default}
.secondary{display:block;width:100%;min-height:54px;border:2px solid var(--cream);border-radius:12px;background:transparent;color:var(--cream);font:800 20px var(--disp);letter-spacing:.02em;margin-top:12px}
.pcard .primary{margin-top:18px}

/* game cards */
.games{display:grid;gap:14px;margin:26px 0 0}
.gcard{position:relative;display:block;text-decoration:none;background:var(--cream);color:var(--ink);border-radius:16px;padding:18px 20px 20px 22px;min-height:132px;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.gcard:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.corner{position:absolute;width:22px;height:22px}
.corner.tr{right:14px;top:14px}
.corner.bl{right:14px;bottom:14px;transform:rotate(180deg)}
.g-title{display:block;font:800 36px/.98 var(--disp);padding-right:46px}
.g-blurb{display:block;color:var(--ink-soft);font-size:16px;margin:6px 0 12px;padding-right:46px}
.g-go{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;background:var(--coral);color:var(--plum-deep);font:800 20px var(--disp);letter-spacing:.03em}

/* footer band */
.band{position:relative;margin-top:44px;background:var(--cream);color:var(--ink);padding:26px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden}
.band-in{max-width:520px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.pieces{display:flex;align-items:flex-end;gap:6px;height:96px;margin-bottom:0}
.pieces svg{display:block;height:100%;width:auto}
.fflogo{width:150px;height:auto;display:block}
.cheers{max-width:520px;margin:24px auto 0;font:700 19px/1.2 var(--disp);color:var(--plum);text-align:left}

/* top bar */
.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--plum);padding:env(safe-area-inset-top,0px) 10px 0}
.link{min-height:48px;display:inline-flex;align-items:center;gap:2px;padding:0 8px;color:var(--cream);font:700 17px var(--sans);text-decoration:none}
.bar-title{font:800 24px var(--disp);letter-spacing:.01em;text-align:center}
.page{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.pagetitle{font:900 clamp(44px,14vw,64px)/.92 var(--disp);margin:12px 0 8px}
.intro{margin:0 0 16px;color:var(--cream)}

/* bingo */
.banner{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--coral);color:var(--plum-deep);border-radius:14px;padding:10px 14px;margin:0 0 14px;font:900 44px/1 var(--disp);letter-spacing:.03em}
.banner svg{width:24px;height:24px;fill:var(--plum-deep);flex:none}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sq{position:relative;min-height:82px;padding:6px 4px;border:3px solid transparent;border-radius:10px;background:var(--cream);color:var(--ink);font:700 19px/1.02 var(--disp);letter-spacing:.005em;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.sq.on{background:var(--teal);color:var(--plum-deep)}
.sq.line{border-color:var(--coral)}
.sq svg{position:absolute;right:4px;top:4px;width:15px;height:15px;fill:var(--plum-deep)}
.status{margin:14px 0 0;color:var(--cream);font-weight:600}

/* quiz */
.qcount{margin:14px 0 6px;color:var(--cream);font-weight:600}
.qdots{display:flex;gap:6px;margin-bottom:10px}
.qdots span{flex:1;height:6px;border-radius:3px;background:rgba(244,230,204,.3)}
.qdots span.done{background:var(--teal)}
.qdots span.cur{background:var(--cream)}
.qtext{font:900 clamp(40px,12vw,54px)/.95 var(--disp);margin:8px 0 18px}
.opts{display:grid;gap:10px}
.opt{min-height:60px;padding:10px 18px;border:0;border-radius:12px;background:var(--cream);color:var(--ink);font:600 19px/1.2 var(--sans);text-align:left}
.opt.sel{background:var(--teal);color:var(--plum-deep)}
.result{position:relative;background:var(--cream);color:var(--ink);border-radius:18px;padding:26px 22px 24px;margin:16px 0 0;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.result .you{font:400 30px/1 var(--script);color:var(--coral)}
.result h1{font:900 clamp(46px,15vw,68px)/.9 var(--disp);margin:6px 0 4px;color:var(--plum)}
.result .tag{font:800 24px var(--disp);color:var(--teal-d);margin:0 0 12px}
.result p{margin:0 0 10px}
.result .pair{font-size:16px;color:var(--ink-soft)}
.result .rs{position:absolute;fill:var(--coral)}
.rs1{left:16px;top:18px;width:22px}
.rs2{right:18px;top:40px;width:16px}

/* preview overlay */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(30,4,20,.8);display:flex;align-items:center;justify-content:center;padding:18px}
.overlay .box{background:var(--cream);color:var(--ink);border-radius:16px;padding:20px;max-width:460px;width:100%;max-height:86vh;overflow:auto}
.overlay h2{font:800 30px/1 var(--disp);margin:0 0 8px}
.overlay dl{margin:12px 0 0;font-size:16px}
.overlay dt{font-weight:700;margin-top:8px}
.overlay dd{margin:0;color:var(--ink-soft);overflow-wrap:anywhere}


/* ---- merged: wine label game, wall, shared controls ---- */
.link{background:none;border:0}
.link.right{justify-self:end}
.link[disabled]{opacity:.35;cursor:default}
.spacer{display:block}
.err{color:#FFB4A8;font-size:15px;font-weight:600;margin-top:6px}
.err:empty{display:none}
.pcard .err{color:#A3201A}
label{display:block;font-weight:600;margin:16px 0 6px}
input[type=text],input[type=tel],input[type=email],input[type=search]{width:100%;min-height:56px;padding:12px 14px;border-radius:10px;border:2px solid transparent;background:#FFF9EC;color:var(--ink);font:500 18px var(--sans)}
.pcard input{border:2px solid rgba(78,12,52,.35)}
.pcard input[aria-invalid="true"]{border-color:#B3261E}
.primary{text-align:center;text-decoration:none;padding:14px 16px;line-height:1.1}
.secondary{text-align:center;text-decoration:none;padding:13px 16px;line-height:1.1}
.fine{font-size:14px;color:var(--cream-d);margin:14px 0 0}
.textbtn{display:block;width:100%;min-height:54px;margin:16px 0 0;border:2px solid var(--cream);border-radius:12px;background:transparent;color:var(--cream);font:800 20px var(--disp);letter-spacing:.02em;text-align:center;text-decoration:none;padding:12px 16px;line-height:1.2}
button.gcard{width:100%;border:0;text-align:left;font:inherit}
.g-name{display:block;font:400 24px/1.1 var(--script);color:var(--teal-d);margin-top:4px;padding-right:46px}
.cards{display:grid;gap:14px;margin:18px 0 0}

/* dots */
.dots{display:flex;justify-content:center}
.dot{width:28px;height:48px;background:none;border:0;display:inline-flex;align-items:center;justify-content:center;padding:0}
.dot span{display:block;width:12px;height:12px;border-radius:50%;border:2px solid var(--cream)}
.dot.done span{background:var(--teal);border-color:var(--teal)}
.dot.cur span{box-shadow:0 0 0 3px var(--plum),0 0 0 5px var(--cream)}

/* the label */
.stage{padding-top:10px}
.label{position:relative;background:var(--cream);color:var(--ink);border-radius:6px;padding:22px 22px 18px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.label::before{content:"";position:absolute;inset:7px;border:2px solid var(--plum);border-radius:3px;pointer-events:none}
.label::after{content:"";position:absolute;inset:12px;border:1px solid rgba(78,12,52,.35);pointer-events:none}
.label-house{font:800 22px/1 var(--disp);letter-spacing:.03em;color:var(--plum)}
.label-band{width:56px;height:5px;border-radius:3px;background:var(--band);margin:9px auto 12px}
.line{margin:0 0 10px;padding:2px 4px;border-radius:4px}
.lq{font-style:italic;font-size:14px;color:var(--ink-soft)}
.la{font:700 25px/1.05 var(--disp);overflow-wrap:anywhere}
.la.blank{height:24px;border-bottom:2px dotted rgba(78,12,52,.4);margin:0 18px}
.line.active .lq{color:var(--plum);font-weight:700}
.line.active .la.blank,.line.active .label-title.empty{border-color:var(--coral)}
.label-title{font:900 42px/.95 var(--disp);margin:3px 0 4px;overflow-wrap:anywhere}
.label-title.empty{font-weight:700;font-size:28px;color:rgba(58,10,38,.32);border-bottom:2px dotted rgba(78,12,52,.4);display:inline-block;padding:0 12px 2px}
.label-kind{font:400 25px/1.1 var(--script);color:var(--teal-d);margin:2px 0 14px}
.label-foot{margin-top:14px;font-size:13px;color:var(--ink-soft)}
.bottled{min-height:28px;font:400 24px/1.1 var(--script);color:var(--plum)}
.line.just{animation:ink .9s ease-out}
@keyframes ink{from{background:rgba(242,106,85,.45)}to{background:rgba(242,106,85,0)}}
.label.compact{padding:18px 16px 14px}
.compact .label-title{font-size:32px}
.compact .la{font-size:22px}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--plum-deep);border-top:3px solid var(--coral);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:62vh;overflow:auto}
.sheet-inner{max-width:520px;margin:0 auto}
.q{font:800 30px/1 var(--disp);margin:0 0 10px;color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:52px;padding:10px 16px;border-radius:12px;border:2px solid var(--cream);background:transparent;color:var(--cream);font:600 17px/1.2 var(--sans);text-align:left}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--plum-deep)}
.chip.own{border-style:dashed;color:var(--cream-d)}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.ghost{min-height:48px;padding:0 14px;border:0;background:none;color:var(--cream);font:700 17px var(--sans);text-decoration:underline;text-underline-offset:3px}
.ownrow{display:flex;gap:8px;margin-top:12px}
.ownrow input{flex:1}
.small{width:auto;min-height:56px;margin:0;padding:0 20px}
.finish{padding-top:10px}
.handoff{margin-top:26px}
.done-note{margin:0 0 12px;color:var(--cream)}
.bottom-space{height:calc(40px + env(safe-area-inset-bottom,0px))}

/* wall */
.wall-sub{margin:0 0 16px;max-width:44ch;color:var(--cream)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.fchip{min-height:46px;padding:8px 18px;border-radius:999px;border:2px solid var(--cream);background:transparent;color:var(--cream);font:800 19px var(--disp);letter-spacing:.02em}
.fchip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--plum-deep)}
.count{color:var(--cream);font-size:15px;margin:0;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin:14px 0 40px;padding-bottom:env(safe-area-inset-bottom,0px)}
.empty{grid-column:1/-1;color:var(--cream)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- wine label game ---------- */
function labelHTML(c, a, o){
  o = o || {};
  const t = c.titleIdx, tv = a[t];
  const tcls = ['line']; if (o.active === t) tcls.push('active'); if (o.just === t) tcls.push('just');
  const lines = c.prompts.map((p, i) => {
    if (i === t) return '';
    const v = a[i];
    if (o.wall && v == null) return '';
    const cls = ['line']; if (o.active === i) cls.push('active'); if (o.just === i) cls.push('just');
    return '<div class="' + cls.join(' ') + '"><div class="lq">' + esc(p.q) + '</div>' +
      (v != null ? '<div class="la">' + esc(cap(v)) + '</div>' : '<div class="la blank" aria-hidden="true"></div>') + '</div>';
  }).join('');
  return '<div class="label' + (o.compact ? ' compact' : '') + '" style="--band:' + c.color + '">' +
    '<div class="label-house">The People’s Wine Cellar</div><div class="label-band"></div>' +
    '<div class="' + tcls.join(' ') + '"><div class="lq">' + esc(c.prompts[t].q) + '</div>' +
      '<div class="label-title' + (tv == null ? ' empty' : '') + '">' + (tv != null ? esc(cap(tv)) : esc(c.ph)) + '</div></div>' +
    '<div class="label-kind">' + esc(c.name) + '</div>' + lines +
    '<div class="label-foot">Vintage 2026, Sidney, Montana<div class="bottled">' + (o.name ? 'Bottled by ' + esc(o.name) : '') + '</div></div></div>';
}

function fit(){
  const s = document.getElementById('sheet'), st = document.getElementById('stage');
  if (!s || !st) return;
  st.style.paddingBottom = (s.offsetHeight + 24) + 'px';
  const el = st.querySelector('.line.active'); if (!el) return;
  const r = el.getBoundingClientRect(), sheetTop = s.getBoundingClientRect().top,
        barB = document.querySelector('.bar').getBoundingClientRect().bottom;
  if (r.bottom > sheetTop - 12) window.scrollBy({top: r.bottom - sheetTop + 28, behavior: smooth});
  else if (r.top < barB + 8) window.scrollBy({top: r.top - barB - 28, behavior: smooth});
}
window.addEventListener('resize', fit);

function applyChoice(v, isOwn){
  W.a[W.step] = v;
  if (isOwn) W.own[W.step] = true; else delete W.own[W.step];
  W.just = W.step; W.adding = false;
  renderBuild();
  clearTimeout(timer);
  timer = setTimeout(() => { W.just = null; nextPrompt(); }, 450);
}
function nextPrompt(){
  if (W.step < cat().prompts.length - 1) { W.step++; W.adding = false; renderBuild(); }
  else { W.screen = 'finish'; renderCellar(); window.scrollTo(0, 0); }
}

/* ---------- BINGO ---------- */
function bingoLines(marks){
  const L = [], n = 4;
  for (let r = 0; r < n; r++) L.push([0,1,2,3].map(c => r * n + c));
  for (let c = 0; c < n; c++) L.push([0,1,2,3].map(r => r * n + c));
  L.push([0,5,10,15]); L.push([3,6,9,12]);
  return L.filter(l => l.every(i => marks[i]));
}
function renderBingo(){
  const marks = S.bingo, lines = bingoLines(marks), n = marks.filter(Boolean).length, inLine = new Set([].concat.apply([], lines));
  app.innerHTML = demoBanner() + bar('Game Night BINGO') +
  '<main class="wrap page"><h1 class="pagetitle">Game Night BINGO</h1>' +

    '<div class="bgrid" role="group" aria-label="BINGO card">' + SQUARES.map((t, i) =>
      '<button class="sq' + (marks[i] ? ' on' : '') + (inLine.has(i) ? ' line' : '') + '" data-act="sq" data-i="' + i + '" aria-pressed="' + !!marks[i] + '">' +

    '<p class="status" aria-live="polite">' + n + ' of ' + SQUARES.length + ' squares marked' + (lines.length ? '. ' + lines.length + (lines.length === 1 ? ' line' : ' lines') + ' complete.' : '.') + '</p>' +

    '<button class="secondary" data-act="clearBingo">' + (S.clearArm ? 'Tap again to clear' : 'Clear card') + '</button>' +
  '</main>';
}

/* ---------- Which wine are you ---------- */
function winnerKey(){
  const picks = S.q.picks, cnt = {};
  picks.forEach(w => { cnt[w] = (cnt[w] || 0) + 1; });
  const max = Math.max.apply(null, Object.keys(cnt).map(k => cnt[k]));
  const tied = Object.keys(cnt).filter(k => cnt[k] === max);
  for (let i = picks.length - 1; i >= 0; i--) if (tied.indexOf(picks[i]) !== -1) return picks[i];
  return tied[0];
}
function renderQuiz(){
  const Q = S.q;
  if (Q.i >= QUIZ.length) return renderResult();
  const item = QUIZ[Q.i];
  app.innerHTML = demoBanner() + bar('Which wine are you?') +

    '<div class="qdots" aria-hidden="true">' + QUIZ.map((_, i) => '<span class="' + (i < Q.i ? 'done' : i === Q.i ? 'cur' : '') + '"></span>').join('') + '</div>' +
    '<h1 class="qtext">' + esc(item.q) + '</h1>' +
    '<div class="opts">' + item.o.map(o => '<button class="opt' + (Q.picks[Q.i] === o.w ? ' sel' : '') + '" data-act="pick" data-w="' + o.w + '">' + esc(o.t) + '</button>').join('') + '</div>' +
    (Q.i > 0 ? '<button class="linkbtn light pad" data-act="qback">Previous question</button>' : '') +
  '</main>';
}
function renderResult(){

/* ---------- sending to Cognito ---------- */
function handoff(game, result, details){
  const p = S.player;
  const entry = {PlayerName:p.name || '', Phone:(p.phone || '').replace(/\D/g, ''), Game:game, Result:result, Details:details || ''};
  if (!LIVE) { showPreview(entry); return; }
  location.href = COGNITO_FORM_URL + (COGNITO_FORM_URL.indexOf('?') === -1 ? '?' : '&') + 'entry=' + encodeURIComponent(JSON.stringify(entry));
}
function showPreview(entry){
  const o = document.createElement('div'); o.className = 'overlay'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');
  o.innerHTML = '<div class="box"><h2>Preview mode</h2><p>On the live page this opens your Cognito form with these answers already filled in:</p><dl>' +
    Object.keys(entry).map(k => '<dt>' + esc(k) + '</dt><dd>' + (esc(entry[k]) || '(blank)') + '</dd>').join('') +
    '</dl><button class="primary" data-act="closePreview">Got it</button></div>';
  document.body.appendChild(o);
  const b = o.querySelector('button'); if (b) b.focus();
}

function render(){ ({home:renderHome, cellar:renderCellar, bingo:renderBingo, quiz:renderQuiz, wall:renderWall})[S.route](); }
function route(){
  const h = location.hash.replace('#', '');
  const next = ['bingo', 'quiz', 'cellar', 'wall'].indexOf(h) !== -1 ? h : 'home';
  if (next === 'quiz' && S.route !== 'quiz') S.q = {i:0, picks:[]};
  if (next === 'cellar' && S.route !== 'cellar') resetCellar();
  S.route = next; S.editing = false; S.clearArm = false;
  clearTimeout(timer); render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

function validPhone(raw){ const d = raw.replace(/\D/g, ''); return d.length === 10 || (d.length === 11 && d[0] === '1'); }
function savePlayer(){
  const name = document.getElementById('pn').value.trim(), phone = document.getElementById('pp').value.trim();
  const en = document.getElementById('epn'), ep = document.getElementById('epp');
  en.textContent = ''; ep.textContent = '';
  document.getElementById('pn').removeAttribute('aria-invalid'); document.getElementById('pp').removeAttribute('aria-invalid');
  let bad = false;
  if (!name) { en.textContent = 'Add your full name so your entry has a name on it.'; document.getElementById('pn').setAttribute('aria-invalid', 'true'); bad = true; }
  if (phone && !validPhone(phone)) { ep.textContent = 'Check the phone number. It needs 10 digits.'; document.getElementById('pp').setAttribute('aria-invalid', 'true'); bad = true; }
  if (bad) { (en.textContent ? document.getElementById('pn') : document.getElementById('pp')).focus(); return; }
  S.player = {name:name, phone:phone}; store('wfg_player', S.player); S.editing = false; renderHome();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const act = t.dataset.act;
  if (['pick', 'cChip', 'cSurprise', 'cAddOwn'].indexOf(act) === -1) clearTimeout(timer);
  switch (act) {
    case 'savePlayer': savePlayer(); break;
    case 'editPlayer': S.editing = true; renderHome(); break;
    case 'cancelEdit': S.editing = false; renderHome(); break;
    /* wine label */
    case 'cPick': W.cat = t.dataset.id; W.step = 0; W.a = {}; W.own = {}; W.adding = false; W.just = null; W.screen = 'build'; renderCellar(); window.scrollTo(0, 0); break;
    case 'cBack':
      if (W.screen === 'finish') { W.step = cat().prompts.length - 1; W.adding = false; W.screen = 'build'; renderCellar(); }
      else if (W.step > 0) { W.step--; W.adding = false; W.just = null; renderBuild(); }
      else { W.screen = 'pick'; renderCellar(); window.scrollTo(0, 0); }
      break;
    case 'cStep': W.step = +t.dataset.i; W.adding = false; W.just = null; renderBuild(); break;
    case 'cFinish': W.screen = 'finish'; renderCellar(); window.scrollTo(0, 0); break;
    case 'cChip': applyChoice(t.dataset.v, false); break;
    case 'cSurprise': { const ch = cat().prompts[W.step].chips; applyChoice(ch[Math.floor(Math.random() * ch.length)], false); break; }
    case 'cOwn': W.adding = !W.adding; renderBuild(); break;
    case 'cAddOwn': { const f = document.getElementById('ownText'), v = f ? f.value.trim() : ''; if (v) applyChoice(v, true); break; }
    case 'cSkip': W.adding = false; nextPrompt(); break;
    case 'cHandoff': cHandoff(); break;
    case 'wFilter': wallFilter = t.dataset.id; paintWall(); break;
    /* BINGO */
    case 'sq': { const i = +t.dataset.i; S.bingo[i] = !S.bingo[i]; S.clearArm = false; store('wfg_bingo', S.bingo); renderBingo(); break; }
    case 'clearBingo':
      if (S.clearArm) { S.bingo = SQUARES.map(() => false); store('wfg_bingo', S.bingo); S.clearArm = false; }
      else S.clearArm = true;
      renderBingo(); break;
    case 'sendBingo': {
      const marks = S.bingo, lines = bingoLines(marks), n = marks.filter(Boolean).length;
      const done = SQUARES.filter((_, i) => marks[i]).join('; ');
      handoff('BINGO', lines.length ? 'BINGO' : 'In progress', n + ' of ' + SQUARES.length + ' squares, ' + lines.length + (lines.length === 1 ? ' line' : ' lines') + '. Marked: ' + done);
      break; }
    /* quiz */
    case 'pick':
      S.q.picks[S.q.i] = t.dataset.w; renderQuiz();
      timer = setTimeout(() => { S.q.i++; renderQuiz(); window.scrollTo(0, 0); }, 320);
      break;
    case 'qback': S.q.i = Math.max(0, S.q.i - 1); renderQuiz(); break;
    case 'sendQuiz': handoff('Which wine are you?', WINES[winnerKey()].name, ''); break;
    case 'retake': S.q = {i:0, picks:[]}; renderQuiz(); window.scrollTo(0, 0); break;
    case 'closePreview': { const o = document.querySelector('.overlay'); if (o) o.remove(); break; }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'wq') { wallQuery = e.target.value; paintWall(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'pn' || e.target.id === 'pp')) { e.preventDefault(); savePlayer(); }
  if (e.key === 'Enter' && e.target.id === 'ownText') { e.preventDefault(); const v = e.target.value.trim(); if (v) applyChoice(v, true); }
  if (e.key === 'Escape') { const o = document.querySelector('.overlay'); if (o) o.remove(); }
});

route();
})();

</script>
</body>
</html>
